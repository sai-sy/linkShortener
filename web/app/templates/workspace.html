{{define "content"}}
  <h1>My Workspaces</h1>
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Created</th>
      </tr>
    </thead>
    <tbody>
      {{range .Workspaces}}
        <tr>
          <td>{{.ID}}</td>
          <td>{{.Name}}</td>
          <td>{{.CreatedAt.Time}}</td>
        </tr>
      {{else}}
        <tr>
          <td colspan="3">No workspaces found.</td>
        </tr>
      {{end}}
    </tbody>
  </table>
  <div>
    {{if gt .Page 1}}
      <a href="/workspace?page={{sub .Page 1}}">Previous</a>
    {{end}}
    <a href="/workspace?page={{add .Page 1}}">Next</a>
  </div>
{{end}}
